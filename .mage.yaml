project:
  name: gtask-extractor
  binary: gtask-extractor
  module: github.com/mrz1836/gtask-extractor
  main: ./cmd/gtask-extractor/main.go

build:
  # Custom ldflags with version injection
  ldflags:
    - "-s -w"
    - "-X main.version={{.Version}}"
    - "-X main.commit={{.Commit}}"
    - "-X main.buildDate={{.Date}}"
  flags:
    - "-trimpath"
  output: "./cmd/gtask-extractor"

test:
  # Match CI timeout configuration (TEST_TIMEOUT_RACE_COVER in .env.base)
  # Default magex timeout is 10m which was killing tests prematurely
  timeout: 30m
